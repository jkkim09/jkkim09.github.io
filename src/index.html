<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="김자경 개발자 포트폴리오 — 경력, 기술, 프로젝트와 이력서"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>김자경 | Developer Portfolio</title>
    <script>
      // Preserve existing GitHub Pages links that encode a route in ?p=.
      (function (location) {
        const params = new URLSearchParams(location.search);
        if (params.has('p')) {
          const pathname = params.get('p') || '/';
          const search = params.get('q');
          const target = `${location.pathname.replace(/\/$/, '')}${pathname}${search ? `?${search.replaceAll('~and~', '&')}` : ''}${location.hash}`;
          window.history.replaceState(null, '', target);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>이 포트폴리오를 보려면 JavaScript를 활성화해 주세요.</noscript>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
